<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Simple, clean crown/chart icon - no background, just the icon -->

  <!-- Crown with upward trend chart in gold -->
  <g transform="translate(8, 15)">
    <!-- Crown base -->
    <rect x="5" y="70" width="75" height="8" fill="#D4AF37" rx="2"/>

    <!-- Left wall -->
    <rect x="5" y="45" width="8" height="25" fill="#D4AF37"/>

    <!-- Rising bars creating crown peaks -->
    <rect x="18" y="38" width="10" height="32" fill="#D4AF37"/>
    <rect x="33" y="28" width="10" height="42" fill="#D4AF37"/>
    <rect x="48" y="18" width="10" height="52" fill="#D4AF37"/>

    <!-- Upward arrow trend -->
    <rect x="63" y="12" width="10" height="58" fill="#D4AF37"/>

    <!-- Arrow point -->
    <polygon points="68,5 63,15 73,15" fill="#D4AF37"/>

    <!-- Right wall -->
    <rect x="77" y="45" width="8" height="25" fill="#D4AF37"/>
  </g>
</svg>
