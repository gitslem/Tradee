<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Light background for visibility in browser tabs -->
  <rect width="100" height="100" fill="#f8f8f8"/>

  <!-- Crown with chart pattern in gold -->
  <g transform="translate(15, 18)">
    <!-- Left peak -->
    <path d="M 8 50 L 8 38 L 15 45 L 15 50 Z"
          fill="none"
          stroke="#D4AF37"
          stroke-width="3"
          stroke-linejoin="miter"/>

    <!-- Middle rising chart peak -->
    <path d="M 15 45 L 15 32 L 22 38 L 22 50"
          fill="none"
          stroke="#D4AF37"
          stroke-width="3"
          stroke-linejoin="miter"/>

    <!-- Center high peak -->
    <path d="M 22 38 L 22 18 L 28 24 L 35 30 L 35 50"
          fill="none"
          stroke="#D4AF37"
          stroke-width="3"
          stroke-linejoin="miter"/>

    <!-- Rising trend to the right (arrow-like) -->
    <path d="M 35 30 L 42 23 L 48 17"
          fill="none"
          stroke="#D4AF37"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="miter"/>

    <!-- Arrow head -->
    <path d="M 48 17 L 44 20 M 48 17 L 48 22"
          fill="none"
          stroke="#D4AF37"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Right wall -->
    <path d="M 48 22 L 48 50"
          fill="none"
          stroke="#D4AF37"
          stroke-width="3"/>

    <!-- Left wall -->
    <path d="M 8 50 L 8 50"
          fill="none"
          stroke="#D4AF37"
          stroke-width="3"/>

    <!-- Bottom base line -->
    <rect x="7" y="52" width="43" height="3" fill="#D4AF37" rx="1"/>
  </g>
</svg>
