<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Light background for visibility in browser tabs -->
  <rect width="100" height="100" fill="#f8f8f8" rx="12"/>

  <!-- Bold crown with upward trend chart in gold - optimized for small sizes -->
  <g transform="translate(12, 20)">
    <!-- Crown shape with chart pattern - using filled paths for better visibility -->

    <!-- Left side of crown -->
    <path d="M 10 60 L 10 45 L 18 50 L 18 60 Z"
          fill="#D4AF37"/>

    <!-- Second peak (rising) -->
    <path d="M 18 50 L 18 35 L 26 40 L 26 60 L 18 60 Z"
          fill="#D4AF37"/>

    <!-- Middle high peak -->
    <path d="M 26 40 L 26 22 L 34 28 L 42 34 L 42 60 L 26 60 Z"
          fill="#D4AF37"/>

    <!-- Right side - upward arrow trend -->
    <path d="M 42 34 L 50 26 L 58 18 L 58 60 L 42 60 Z"
          fill="#D4AF37"/>

    <!-- Arrow head pointing up-right -->
    <path d="M 54 18 L 54 26 L 58 18 L 66 22 L 58 18 Z"
          fill="#D4AF37"/>

    <!-- Base of crown (thicker) -->
    <rect x="10" y="62" width="56" height="6" fill="#D4AF37" rx="2"/>
  </g>
</svg>
